<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>App Financeiro — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #e9e3d6; font-family: 'Montserrat', sans-serif; color: #1a1815; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }

  /* Show/hide red annotation notes */
  body.no-notes [data-note] { display: none !important; }

  /* Subtle paper texture on canvas background */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background:
      radial-gradient(circle at 20% 10%, #00000005 0, transparent 60%),
      radial-gradient(circle at 80% 90%, #00000008 0, transparent 60%);
  }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="macos-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframes.jsx"></script>
<script type="text/babel" src="features-extra.jsx"></script>
<script type="text/babel" src="goals.jsx"></script>
<script type="text/babel" src="extra2.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, MacWindow, KindSwitch } = window;
const { TweaksPanel, useTweaks, TweakSection, TweakToggle, TweakRadio } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showNotes": true,
  "appWindow": "none"
}/*EDITMODE-END*/;

// Move red annotations to be conditionally rendered via class
// (the wireframes.jsx Note component already renders; we just hide via body class)

function App() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.body.classList.toggle('no-notes', !t.showNotes);
  }, [t.showNotes]);

  // Tag all Note spans so the body class can hide them — we do this with a wrapper
  // (the Note component renders an absolutely positioned div; we'll add data-note via querySelectorAll)
  React.useEffect(() => {
    // Notes are positioned divs with color #b04a3a — let's mark them
    const notes = document.querySelectorAll('div[style*="b04a3a"][style*="position: absolute"]');
    notes.forEach(n => n.setAttribute('data-note', '1'));
  });

  const W = 1200, H = 760;

  const wrap = (Comp, key) => {
    if (t.appWindow === 'none') {
      return (
        <div style={{ width: W, height: H, borderRadius: 8, overflow: 'hidden', border: '1.5px solid #1a1815', background: '#fbf8f1' }}>
          <Comp />
        </div>
      );
    }
    return (
      <MacWindow title="App Financeiro — Davi & Eduarda" width={W} height={H}>
        <Comp />
      </MacWindow>
    );
  };

  return (
    <>
      {/* Page brand mark — floats over the canvas */}
      <div style={{
        position: 'fixed', top: 16, left: 20, zIndex: 50,
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '8px 14px',
        background: 'rgba(251, 248, 241, 0.92)',
        border: '1.5px solid #1a1815',
        borderRadius: 10,
        boxShadow: '0 4px 14px rgba(0,0,0,0.08)',
        backdropFilter: 'blur(6px)',
      }}>
        <img src="assets/poupe-logo-trim.png" alt="Poupê" style={{ height: 30, display: 'block' }} />
        <div style={{ borderLeft: '1px dashed #4a463f88', paddingLeft: 10, fontFamily: 'Montserrat, sans-serif', fontSize: 11, color: '#4a463f', lineHeight: 1.25 }}>
          App Financeiro<br/>
          <span style={{ color: '#8a857a' }}>Davi &amp; Eduarda · Wireframes</span>
        </div>
      </div>

      <DesignCanvas
        title="App Financeiro — Wireframes"
        subtitle="4 direções low-fi · Davi & Eduarda · Agosto 2025"
      >
        <DCSection
          id="auth"
          title="Autenticação"
          subtitle="login por e-mail/senha ou provedores sociais"
        >
          <DCArtboard id="login" label="Login" width={1180} height={700}>
            <div style={{ width: 1180, height: 700, borderRadius: 8, overflow: 'hidden', border: '1.5px solid #1a1815' }}>
              <window.VarLogin />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="onboarding"
          title="Onboarding · Primeiro acesso"
          subtitle="boas-vindas + briefing que personaliza o app — 4 telas em sequência"
        >
          <DCArtboard id="onb-welcome" label="0 · Boas-vindas" width={960} height={720}>
            <div style={{ width: 960, height: 720, borderRadius: 8, overflow: 'hidden', border: '1.5px solid #1a1815', background: '#fbf8f1' }}>
              <window.OnbWelcome />
            </div>
          </DCArtboard>

          <DCArtboard id="onb-people" label="1 · Quem usa o app" width={960} height={720}>
            <div style={{ width: 960, height: 720, borderRadius: 8, overflow: 'hidden', border: '1.5px solid #1a1815', background: '#fbf8f1' }}>
              <window.OnbPeople />
            </div>
          </DCArtboard>

          <DCArtboard id="onb-categories" label="2 · Categorias" width={960} height={720}>
            <div style={{ width: 960, height: 720, borderRadius: 8, overflow: 'hidden', border: '1.5px solid #1a1815', background: '#fbf8f1' }}>
              <window.OnbCategories />
            </div>
          </DCArtboard>

          <DCArtboard id="onb-payments" label="3 · Tipos de pagamento" width={960} height={720}>
            <div style={{ width: 960, height: 720, borderRadius: 8, overflow: 'hidden', border: '1.5px solid #1a1815', background: '#fbf8f1' }}>
              <window.OnbPaymentTypes />
            </div>
          </DCArtboard>

          <DCArtboard id="onb-done" label="4 · Pronto!" width={960} height={720}>
            <div style={{ width: 960, height: 720, borderRadius: 8, overflow: 'hidden', border: '1.5px solid #1a1815', background: '#fbf8f1' }}>
              <window.OnbDone />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="main"
          title="4 direções para explorar"
          subtitle="cada artboard é o app inteiro — clique no card para abrir em tela cheia"
        >
          <DCArtboard id="v1" label="A · Dashboard + entrada rápida" width={W} height={H}>
            {wrap(window.VarDashboard)}
          </DCArtboard>

          <DCArtboard id="v2" label="B · Planilha refinada" width={W} height={H}>
            {wrap(window.VarSheet)}
          </DCArtboard>

          <DCArtboard id="v3" label="C · Widgets configuráveis" width={W} height={H}>
            {wrap(window.VarWidgets)}
          </DCArtboard>

          <DCArtboard id="v4" label="D · Timeline / feed diário" width={W} height={H}>
            {wrap(window.VarTimeline)}
          </DCArtboard>

          <DCArtboard id="gastos-mes" label="Aba · Gastos do mês (avulsos)" width={W} height={H}>
            {wrap(window.VarGastosDoMes)}
          </DCArtboard>

          <DCArtboard id="parcelamentos" label="Aba · Parcelamentos" width={W} height={H}>
            {wrap(window.VarParcelamentos)}
          </DCArtboard>
        </DCSection>

        <DCSection
          id="novas"
          title="Novas funcionalidades · IA"
          subtitle="diagnóstico mensal + plano de quitação — wireframes da feature, não de toda a navegação"
        >
          <DCArtboard id="diag" label="Diagnóstico financeiro mensal (IA)" width={W} height={H}>
            {wrap(window.VarDiagnostico)}
          </DCArtboard>

          <DCArtboard id="dividas" label="Controlador de dívidas + plano de quitação" width={W} height={H}>
            {wrap(window.VarDividas)}
          </DCArtboard>

          <DCArtboard id="metas" label="Simulador de metas com IA" width={W} height={H}>
            {wrap(window.VarMetas)}
          </DCArtboard>
        </DCSection>

        <DCSection
          id="notes"
          title="Decisões compartilhadas"
          subtitle="o que é igual em todas as variações"
        >
          <DCArtboard id="shared" label="Sistema compartilhado" width={720} height={620}>
            <div style={{ padding: 28, height: '100%', background: '#fbf8f1', fontFamily: 'Montserrat, sans-serif', color: '#1a1815', overflow: 'auto' }}>
              <div style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 32, lineHeight: 1 }}>O que ficou igual em todas</div>
              <svg width="180" height="6" style={{ marginTop: 4 }}>
                <path d="M 1 3 Q 60 0 120 3 T 180 3" stroke="#1a1815" strokeWidth="1.5" fill="none" />
              </svg>

              <div style={{ marginTop: 18, display: 'flex', flexDirection: 'column', gap: 14, fontSize: 14, lineHeight: 1.45 }}>
                <div>
                  <b style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 20 }}>↳ Top bar com abas</b><br/>
                  Lançamentos · Fixos · Parcelamentos · Investimentos · Relatórios.
                  Filtro de pessoa (Todos / Davi / Eduarda) sempre visível à direita.
                </div>
                <div>
                  <b style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 20 }}>↳ Timeline horizontal de meses</b><br/>
                  Jan→Dez visíveis. Mês ativo marcado, o resto navegável com 1 clique. Sem dropdown.
                </div>
                <div>
                  <b style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 20 }}>↳ Tipo de gasto na entrada</b><br/>
                  Toggle <b>Comum / Fixo / Parcelamento</b> em todo lugar onde se lança gasto.
                  Fixo pergunta o dia do mês; parcelamento pergunta número de parcelas.
                </div>
                <div>
                  <b style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 20 }}>↳ Botão flutuante "+"</b><br/>
                  Canto inferior direito. Abre modal de lançamento rápido em qualquer tela.
                </div>
                <div>
                  <b style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 20 }}>↳ Alerta de prazo nos fixos</b><br/>
                  <span style={{ color: '#b04a3a' }}>vermelho hoje</span> · <span style={{ color: '#c97a3a' }}>laranja em breve</span> · cinza ok.
                </div>
                <div>
                  <b style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 20 }}>↳ Indicadores sutis</b><br/>
                  Barras de progresso, %, donuts pequenos. Sem gráficos cheios — foco no número.
                </div>
                <div>
                  <b style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 20 }}>↳ Paleta nova de categorias</b><br/>
                  Tons mais sóbrios que a planilha. Mesmas categorias, novas cores:
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 8 }}>
                    {[
                      ['#b04a3a', 'Contas'],['#7a8a3a', 'Mercado'],['#3a6a8a', 'Combustível'],
                      ['#2f5a48', 'Carro'],['#c79bb0', 'Beleza'],['#7a6ca8', 'Academia'],
                      ['#d4a24a', 'Assinatura'],['#5a8a9a', 'Igreja'],['#c97a3a', 'Fins de semana'],
                      ['#8a9a5a', 'Saúde'],['#a86a6a', 'Roupa'],['#c44a4a', 'Viagem'],
                    ].map(([c, n], i) => (
                      <span key={i} style={{
                        display: 'inline-flex', alignItems: 'center', gap: 6,
                        padding: '3px 10px', border: '1.4px solid #4a463f', borderRadius: 99, fontSize: 11,
                      }}>
                        <span style={{ width: 10, height: 10, borderRadius: 99, background: c }} />
                        {n}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id="modal-parcela" label="Modal · novo parcelamento" width={520} height={640}>
            <div style={{ padding: 24, height: '100%', background: 'rgba(0,0,0,0.06)', fontFamily: 'Montserrat, sans-serif', color: '#1a1815', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: '#fbf8f1', border: '1.5px solid #1a1815', borderRadius: 10, padding: 22, width: '100%', boxShadow: '0 10px 30px rgba(0,0,0,0.15)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div style={{ fontWeight: 700, letterSpacing: '-0.01em', fontSize: 26 }}>Novo lançamento</div>
                  <span style={{ color: '#8a857a', fontSize: 16 }}>esc</span>
                </div>
                <svg width="120" height="6" style={{ marginTop: 2 }}><path d="M 1 3 Q 40 0 80 3 T 120 3" stroke="#1a1815" strokeWidth="1.5" fill="none" /></svg>
                <div style={{ marginTop: 14 }}>
                  <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 6 }}>tipo de gasto</div>
                  <KindSwitch active="Parcelamento" size="md" />
                </div>
                <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <div>
                    <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>descrição</div>
                    <div style={{ border: '1.5px dashed #4a463f', borderRadius: 6, padding: '8px 10px', color: '#8a857a', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 18 }}>iPhone 15</div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>valor da parcela</div>
                      <div style={{ border: '1.5px solid #1a1815', borderRadius: 6, padding: '8px 10px', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 22 }}>R$ 320,00</div>
                    </div>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>total de parcelas</div>
                      <div style={{ border: '1.5px dashed #4a463f', borderRadius: 6, padding: '8px 10px', color: '#8a857a', fontWeight: 700, fontSize: 18 }}>12x</div>
                    </div>
                  </div>
                  <div style={{ padding: '10px 12px', border: '1.6px solid #2f5a48', borderRadius: 8, background: '#2f5a4810' }}>
                    <div style={{ fontSize: 11, color: '#2f5a48', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: 6 }}>⬆ qual parcela está pagando agora?</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div style={{ flex: 1, border: '1.5px solid #2f5a48', borderRadius: 6, padding: '8px 10px', background: '#fbf8f1', fontWeight: 700, fontSize: 20, textAlign: 'center' }}>6</div>
                      <span style={{ color: '#4a463f', fontWeight: 600 }}>de</span>
                      <div style={{ flex: 1, border: '1.4px dashed #4a463f', borderRadius: 6, padding: '8px 10px', color: '#8a857a', fontWeight: 600, fontSize: 20, textAlign: 'center' }}>12</div>
                    </div>
                    <div style={{ fontSize: 11, color: '#4a463f', marginTop: 8 }}>as próximas parcelas são lançadas sozinhas todo mês</div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>quem</div>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <span style={{ flex: 1, padding: '6px 0', textAlign: 'center', border: '1.5px solid #1a1815', borderRadius: 6, background: '#1a1815', color: '#fbf8f1', fontWeight: 700, fontSize: 16 }}>Davi</span>
                        <span style={{ flex: 1, padding: '6px 0', textAlign: 'center', border: '1.4px dashed #4a463f', borderRadius: 6, fontWeight: 700, fontSize: 16, color: '#8a857a' }}>Eduarda</span>
                      </div>
                    </div>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>cartão</div>
                      <div style={{ border: '1.4px dashed #4a463f', borderRadius: 6, padding: '6px 10px', color: '#8a857a', fontWeight: 700, fontSize: 16 }}>Nubank ▾</div>
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 20 }}>
                  <span style={{ fontSize: 11, color: '#8a857a', alignSelf: 'center' }}>⌘↵ salvar</span>
                  <span style={{ background: '#1a1815', color: '#fbf8f1', padding: '8px 18px', borderRadius: 6, fontWeight: 700, letterSpacing: '-0.01em', fontSize: 18 }}>salvar</span>
                </div>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id="modal" label="Modal de + (igual em todas)" width={520} height={620}>
            <div style={{ padding: 24, height: '100%', background: 'rgba(0,0,0,0.06)', fontFamily: 'Montserrat, sans-serif', color: '#1a1815', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: '#fbf8f1', border: '1.5px solid #1a1815', borderRadius: 10, padding: 22, width: '100%', boxShadow: '0 10px 30px rgba(0,0,0,0.15)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 26 }}>Novo lançamento</div>
                  <span style={{ color: '#8a857a', fontSize: 16 }}>esc</span>
                </div>
                <svg width="120" height="6" style={{ marginTop: 2 }}><path d="M 1 3 Q 40 0 80 3 T 120 3" stroke="#1a1815" strokeWidth="1.5" fill="none" /></svg>

                <div style={{ marginTop: 14 }}>
                  <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 6 }}>tipo de gasto</div>
                  <KindSwitch active="Comum" size="md" />
                </div>

                <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <div>
                    <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>descrição</div>
                    <div style={{ border: '1.5px dashed #4a463f', borderRadius: 6, padding: '8px 10px', color: '#8a857a', fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 18 }}>Mercado mês</div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>valor</div>
                      <div style={{ border: '1.5px solid #1a1815', borderRadius: 6, padding: '8px 10px', fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 22 }}>R$ 642,30</div>
                    </div>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>data</div>
                      <div style={{ border: '1.5px dashed #4a463f', borderRadius: 6, padding: '8px 10px', color: '#8a857a' }}>hoje · 23 ago</div>
                    </div>
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>categoria</div>
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      {[['#7a8a3a', 'Mercado', true],['#d4b48a', 'Padaria'],['#3a6a8a', 'Combustível'],['#c97a3a', 'Fim de semana'],['#b04a3a', 'Contas']].map(([c, n, a], i) => (
                        <span key={i} style={{
                          display: 'inline-flex', alignItems: 'center', gap: 6,
                          padding: '4px 10px', borderRadius: 99,
                          border: a ? '1.5px solid #1a1815' : '1.4px solid #4a463f',
                          background: a ? '#1a1815' : 'transparent', color: a ? '#fbf8f1' : '#1a1815', fontSize: 12,
                        }}>
                          <span style={{ width: 8, height: 8, borderRadius: 99, background: c }} />{n}
                        </span>
                      ))}
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>quem</div>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <span style={{ flex: 1, padding: '6px 0', textAlign: 'center', border: '1.5px solid #1a1815', borderRadius: 6, background: '#1a1815', color: '#fbf8f1', fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 16 }}>Eduarda</span>
                        <span style={{ flex: 1, padding: '6px 0', textAlign: 'center', border: '1.4px dashed #4a463f', borderRadius: 6, fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 16, color: '#8a857a' }}>Davi</span>
                      </div>
                    </div>
                    <div>
                      <div style={{ fontSize: 11, color: '#8a857a', marginBottom: 4 }}>tipo</div>
                      <div style={{ border: '1.4px dashed #4a463f', borderRadius: 6, padding: '6px 10px', color: '#8a857a', fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 16 }}>Nubank ▾</div>
                    </div>
                  </div>
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 20 }}>
                  <span style={{ fontSize: 11, color: '#8a857a', alignSelf: 'center' }}>⌘↵ salvar</span>
                  <span style={{ background: '#1a1815', color: '#fbf8f1', padding: '8px 18px', borderRadius: 6, fontFamily: 'Montserrat, sans-serif', fontWeight: 700, letterSpacing: '-0.01em', fontSize: 18 }}>salvar</span>
                </div>
              </div>
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Apresentação">
          <TweakToggle label="Anotações vermelhas" value={t.showNotes} onChange={(v) => setT('showNotes', v)} />
          <TweakRadio label="Moldura" value={t.appWindow} onChange={(v) => setT('appWindow', v)}
            options={[{label: 'macOS', value: 'macos'}, {label: 'Sem moldura', value: 'none'}]} />
        </TweakSection>
        <TweakSection title="Em breve">
          <div style={{ fontSize: 12, color: '#8a857a', padding: '4px 0' }}>
            Quando uma direção for escolhida, viramos hi-fi e adicionamos<br/>
            tema claro/escuro de verdade, densidade e modo privacidade.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
