name: Supabase keep-alive

on:
  schedule:
    # A cada 3 dias às 12:00 UTC — bem dentro da janela de ~7 dias que o
    # Supabase usa pra pausar projetos gratuitos sem atividade.
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar a API do Supabase
        run: |
          # Usa a chave anônima pública do projeto — a mesma já embutida
          # no front-end, não é segredo.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_gjl6_W6hou0MzIVcnd8YeA_lxdWOOGg" \
            "https://pvbvsyyulppieoedfmpy.supabase.co/rest/v1/")
          echo "Resposta da API do Supabase: HTTP $code"
          # Qualquer resposta (inclusive 401/404) já conta como atividade
          # e evita a pausa automática — só falha se a conexão cair de vez.
          if [ "$code" = "000" ]; then
            echo "Não conseguiu nem conectar no Supabase."
            exit 1
          fi
